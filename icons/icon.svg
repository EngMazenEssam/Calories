<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Warm organic rounded container -->
  <rect width="512" height="512" rx="112" fill="#F8F5ED"/>
  <rect width="496" height="496" x="8" y="8" rx="104" fill="#F0E9DA" stroke="#185C46" stroke-width="8"/>

  <!-- Inner delicate ring -->
  <circle cx="256" cy="256" r="200" fill="#FAF7F2" stroke="#E2D9C5" stroke-width="4"/>

  <!-- Plate base -->
  <ellipse cx="256" cy="340" rx="145" ry="42" fill="#F0E9DA" stroke="#D5C8B0" stroke-width="4"/>
  
  <!-- Warm pancake stacks -->
  <ellipse cx="256" cy="295" rx="115" ry="30" fill="#B47B16"/>
  <ellipse cx="256" cy="285" rx="115" ry="28" fill="#D99414"/>
  
  <ellipse cx="256" cy="255" rx="108" ry="27" fill="#B47B16"/>
  <ellipse cx="256" cy="245" rx="108" ry="25" fill="#E6A728"/>

  <ellipse cx="256" cy="215" rx="100" ry="24" fill="#B47B16"/>
  <ellipse cx="256" cy="207" rx="100" ry="22" fill="#F2BE54"/>

  <!-- Butter / honey drop -->
