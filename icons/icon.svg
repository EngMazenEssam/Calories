  <!-- Botanical Leaf emblem on top -->
  <path d="M 256,80 C 295,95 310,135 256,155 C 202,135 217,95 256,80 Z" fill="#185C46"/>
  <path d="M 256,80 L 256,152" stroke="#FAF7F2" stroke-width="4" stroke-linecap="round"/>

  <!-- Badge banner -->
  <rect x="146" y="385" width="220" height="46" rx="23" fill="#185C46"/>
  <text x="256" y="416" text-anchor="middle" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="800" fill="#F8F5ED">حاسبة أكلي</text>
</svg>
